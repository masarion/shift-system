<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1565C0">
  <title>希望シフト提出システム</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:16px; padding:24px; }
    .top-title { font-size:20px; font-weight:700; color:#1565C0; margin-bottom:8px; text-align:center; }
    .top-sub   { font-size:13px; color:#616161; margin-bottom:24px; text-align:center; }
    .nav-card  { display:flex; flex-direction:column; align-items:center; gap:8px; width:100%; max-width:320px;
                 background:#fff; border-radius:12px; padding:24px 20px; box-shadow:0 2px 8px rgba(0,0,0,0.1);
                 text-decoration:none; color:inherit; border:2px solid transparent; transition:border 0.2s; }
    .nav-card:hover { border-color:#1565C0; }
    .nav-card-icon { font-size:36px; }
    .nav-card-label { font-size:16px; font-weight:700; color:#1565C0; }
    .nav-card-desc  { font-size:12px; color:#616161; text-align:center; }
  </style>
</head>
<body>
  <div class="top-title" id="topTitle">シフト管理システム</div>
  <div class="top-sub">アクセスするページを選んでください</div>

  <a class="nav-card" href="staff.html">
    <span class="nav-card-icon">📅</span>
    <span class="nav-card-label">希望シフト提出</span>
    <span class="nav-card-desc">スタッフ向け — 希望シフトを入力して提出します</span>
  </a>

  <a class="nav-card" href="dashboard.html">
    <span class="nav-card-icon">📊</span>
    <span class="nav-card-label">管理者ダッシュボード</span>
    <span class="nav-card-desc">管理者向け — 提出状況とシフト一覧を確認します</span>
  </a>
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('shiftSystem_settings') || '{}');
      const el = document.getElementById('topTitle');
      if (s.orgName) {
        el.innerHTML = s.orgName + '<br><span style="font-size:14px;font-weight:400;color:#616161">シフト管理システム</span>';
      }
    } catch {}
  </script>
</body>
</html>
